# Spotify:把 iPhone 端 artistview 改为 iPad 端,最终版原样
^https:\/\/(?:\w+-spclient|spclient\.wg)\.spotify\.com(?::443)?\/artistview\/v1\/artist\/(.*)&platform=iphone https://spclient.wg.spotify.com/artistview/v1/artist/$1&platform=ipad header
# Google 搜索防跳转,附件原样
'^https?://(www.)?g.cn' 'https://www.google.com' 302
'^https?://(www.)?google.cn' 'https://www.google.com' 302

[Map Local]
# Spotify:广告类请求直接返回空
^https:\/\/(?:\w+-spclient|spclient\.wg)\.spotify\.com(?::443)?\/(?:ad-|pendragon) data-type=text data="" status-code=200
# 注:已删 YouTube initplayback Map Local(可能误伤正常播放),去广告靠下面 YouTube 响应脚本

[Script]
# 3 条自写脚本,同仓库 raw 链接,永久有效;解析失败原样放行,绝不让 App 打不开
spotify.adblock.self = type=http-response,pattern=^https:\/\/(?:\w+-spclient|spclient\.wg)\.spotify\.com(?::443)?\/(?:bootstrap|user-customization-service),script-path=https://raw.githubusercontent.com/cosmicdremer/Shadow-rocket-cofig-/main/scripts/spotify-adblock-self.js,requires-body=true,binary-body-mode=true
youtube.request.self = type=http-request,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch),requires-body=1,script-path=https://raw.githubusercontent.com/cosmicdremer/Shadow-rocket-cofig-/main/scripts/youtube-request-self.js
youtube.response.self = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch),requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/cosmicdremer/Shadow-rocket-cofig-/main/scripts/youtube-response-self.js

[MITM]
hostname = %APPEND% spclient.wg.spotify.com, *spclient.spotify.com, *.googlevideo.com, youtubei.googleapis.com, *.google.cn
enable = true
