# Shadowrocket 完整版 2026-11-03 整改版(自写脚本,无外部脚本,无过期链接)
# 要求汇总(用户定稿):
#  AI(Gemini/ChatGPT/Claude/Grok/Perplexity/DeepSeek/Copilot/Poe 等)+muse.ai -> 美国固定(select 手动钉死一个美国节点,不自动换)
#  谷歌系列(Gmail/Google/YouTube/Google 视频/Google 账号与接口) -> 美国固定,同上
#  Spotify -> 日本固定(select 手动钉死一个日本节点)
#  国内网站/平台 -> DIRECT 直连,国外未知流量兜底 FINAL -> 美国固定
#  脚本:3 条自写脚本,同仓库 raw 链接,永久有效;只清理广告字段,解析失败原样放行,不伪造账号等级
#  本文件不含任何节点/订阅/密码,节点须用自己的订阅在小火箭首页添加;美国固定/日本固定里各手动选一个节点
#  出问题先分两步隔离:①关当前配置的 HTTPS 解密重开 App ②换一个同国节点;不要先改规则、不要一天换一个文件
#
# [2026-11-03 整改] 脚本改回 3 条自写脚本(同仓库 raw 链接),删全部外部脚本与过期链接;分流/分组/规则按定稿保留。
# Shadowrocket 完整版(Leo 专用,最终版 + 附件 lazy_group 合并)
# 2026-10-29 合并,来源:
#   A. 最终修复版 Shadowrocket-US-JP-Final-Fixed.conf:分流钉死、脚本修复、MITM、证书教程
#   B. 附件 lazy_group.conf(2026-10-29 18:44导出):分组、规则集、国内直连、General/DNS/Host
# 合并原则,先说清楚,免得你以为我乱改:
#   1. 钉死不动:AI 只走美国固定,Spotify 只走日本固定,都是 select 手动选,不自动测速换节点。
#      附件里 AI 组原来写死了几个圣何塞节点名、Spotify 组里带 DIRECT,都改掉了:
#      写死节点名换订阅就失效,Spotify 带 DIRECT 有可能直连绕过日本节点,都不是你想要的。
#   2. 地区组保留 url-test:香港/台湾/日本/新加坡/韩国/美国节点组,供 YouTube/Netflix 等
#      可以换节点的服务用,和“美国固定/日本固定”不是同一个组,别混用。
#      美国固定 = 给 AI 用的 select;美国节点 = 给其他服务用的 url-test。
#      日本固定 = 给 Spotify 用的 select;日本节点 = 给其他服务用的 url-test。
#   3. 国内优先直连:国内规则集 + 国内域名 + GEOIP,CN,DIRECT 全部放在 FINAL 之前,
#      国内平台先直连,不会走到国外固定节点,也不受 MITM/脚本影响(MITM 只含 Spotify/YouTube)。
#   4. 脚本只留 3 条自写脚本,同仓库 raw 链接,无死链、无过期链接:Spotify 广告清理、YouTube 请求、YouTube 响应。
#      已死的 3 条旧脚本本文件里根本没有。
#   5. 兜底 FINAL = 美国固定:未知国外流量也走固定美国节点,不跳 IP,和 AI 需求一致。
#      国内 IP 会先被 GEOIP,CN,DIRECT 拦住,到不了 FINAL,所以国内平台不受兜底影响。
#
# ===== 照着做,和最终版一样 5 步 =====
# 第1步 导配置:点聊天里的链接,小火箭 > 配置 > 右上角 + > 粘贴链接下载 > 使用配置,
#   首页 > 全局路由选“配置”,不要选直连/代理。
# 第2步 加节点并钉死:首页 > 右上角 + > 类型选 Subscribe,加你自己的节点订阅(本文件不含节点)。
#   美国固定组手动点一个美国节点,日本固定组手动点一个日本节点,各点一次,别用自动测速。
#   其他服务组(YouTube 等)默认已选好,一般不用动,想换地区再点那个组自己选。
# 第3步 生成证书(在小火箭里):配置页找到本文件这一行,点右边的 ⓘ > HTTPS解密 > 证书 > 生成新的CA证书 > 安装证书。
# 第4步 系统里安装描述文件:打开 iPhone 设置,顶部出现“已下载描述文件”就点进去安装,输锁屏密码;
#   顶部没有,就去 设置 > 通用 > VPN与设备管理 > 已下载的描述文件里安装。
# 第5步 系统里信任证书(最关键):设置 > 通用 > 关于本机 > 证书信任设置,找到 Shadowrocket 那一项,把开关打开,点继续。
#   然后回小火箭把顶部开关打开,第一次会弹 VPN 配置,点允许。
#
# ===== 验证 =====
#   国内:微信/支付宝/淘宝/京东/哔哩哔哩/抖音打开正常,付款/刷视频不卡、不提示地区异常。
#   国外:Spotify 播一首、YouTube 看一个视频、Gemini/ChatGPT 能正常用。
#   脚本:配置详情 > 脚本 URL,应为 3/3 全绿,不应再有旧死脚本。
#   如果 Spotify/YouTube 打不开或一直转圈:先去第5步确认信任开关是开的,再清后台重开;
#   还不行,就先把配置 ⓘ > HTTPS解密关掉,分流照常用,只是脚本暂时不跑,不会断网。

